<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("theme");
        } catch {
          // Use the system theme when browser storage is unavailable.
        }
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <style>
      html {
        color-scheme: light;
        background: oklch(1 0 0);
      }
      html.dark {
        color-scheme: dark;
        background: oklch(0.1776 0 0);
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/fullfav.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171717" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>ysocial</title>
    <meta
      name="description"
      content="Open source, private and accessible microblogging platform."
    />
    <link rel="canonical" href="https://ysocial.cc/" />
    <meta property="og:site_name" content="ysocial" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ysocial" />
    <meta
      property="og:description"
      content="Open source, private and accessible microblogging platform."
    />
    <meta property="og:url" content="https://ysocial.cc/" />
    <meta property="og:image" content="https://ysocial.cc/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ysocial" />
    <meta
      name="twitter:description"
      content="Open source, private and accessible microblogging platform."
    />
    <meta name="twitter:image" content="https://ysocial.cc/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
